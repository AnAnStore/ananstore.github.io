<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安安百货 - 官方专属直达通道</title>
    <link rel="icon" type="image/jpeg" href="images/avatar.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden; 
            position: relative;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.7);
            z-index: 1;
        }

        #effectCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; 
            pointer-events: none;
        }

        /* ====== 5个人物分身的容器 ====== */
        .characters-wrapper {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; 
            flex-wrap: wrap; /* 手机屏幕会自动换行，完美适配电脑和手机 */
            width: 100%;
            max-width: 1300px;
        }

        /* 单个人物卡片 (核心：用来定义颜色) */
        .gift-box-character {
            position: relative;
            width: 200px; /* 5个人物时的合适大小 */
            display: block;
            text-decoration: none;
            transition: transform 0.4s ease, filter 0.4s ease;
            cursor: pointer;
        }

        /* ====== 【关键】给每个分身设置不同的霓虹衣服色 ====== */
        .gift-box-character.color-1 { --neon-color: #00f3ff; } /* 青蓝色 */
        .gift-box-character.color-2 { --neon-color: #ff00ff; } /* 霓虹粉 */
        .gift-box-character.color-3 { --neon-color: #ffd700; } /* 金黄色 */
        .gift-box-character.color-4 { --neon-color: #00ff7f; } /* 翡翠绿 */
        .gift-box-character.color-5 { --neon-color: #9400d3; } /* 紫罗兰 */

        /* 鼠标悬停整体悬浮和颜色爆发 */
        .gift-box-character:hover {
            transform: translateY(-12px) scale(1.03);
            /* 使用各自的霓虹色产生发光 */
            filter: drop-shadow(0 0 25px var(--neon-color));
        }

        /* 人物图片本体 */
        .char-img {
            width: 100%;
            height: auto;
            display: block;
            /* 关键：使用各自的霓虹色对衣服边缘进行上色 */
            border: 2px solid rgba(var(--neon-color), 0.2);
            border-radius: 20px;
        }

        /* 精准贴合礼盒的文字按钮 */
        .box-button-label {
            position: absolute;
            /* 👇 这个 bottom 百分比极其重要，需要微调到刚好盖在礼盒上 */
            bottom: 24%; 
            left: 50%;
            transform: translateX(-50%);
            
            /* 文字样式：赛博霓虹风格 */
            background: rgba(10, 10, 25, 0.95);
            color: var(--neon-color); /* 文字使用各自的霓虹色 */
            padding: 7px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            /* 霓虹灯边框特效 */
            border: 1px solid var(--neon-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            
            z-index: 4;
            transition: all 0.3s ease;
        }

        /* 鼠标悬停时，怀里的礼盒按钮变亮变炫酷 */
        .gift-box-character:hover .box-button-label {
            background: var(--neon-color); /* 鼠标覆盖时背景变色 */
            color: #000;
            box-shadow: 0 0 20px var(--neon-color);
        }

    </style>
</head>
<body>
    <div class="overlay"></div>
    <canvas id="effectCanvas"></canvas>

    <div class="characters-wrapper">
        
        <a href="https://t.me/BF88878" target="_blank" class="gift-box-character color-1">
            <img src="images/box-character.png" alt="TG客服" class="char-img">
            <div class="box-button-label">TG客服</div>
        </a>

        <a href="https://t.me/BF88878" target="_blank" class="gift-box-character color-2">
            <img src="images/box-character.png" alt="微信客服" class="char-img">
            <div class="box-button-label">微信客服</div>
        </a>

        <a href="https://t.me/BF88878" target="_blank" class="gift-box-character color-3">
            <img src="images/box-character.png" alt="商品目录" class="char-img">
            <div class="box-button-label">商品目录</div>
        </a>

        <a href="https://t.me/BF88878" target="_blank" class="gift-box-character color-4">
            <img src="images/box-character.png" alt="优惠活动" class="char-img">
            <div class="box-button-label">优惠活动</div>
        </a>

        <a href="https://t.me/BF88878" target="_blank" class="gift-box-character color-5">
            <img src="images/box-character.png" alt="售后保障" class="char-img">
            <div class="box-button-label">售后保障</div>
        </a>

    </div>

    <script>
        // 背景雨滴和鼠标特效
        const canvas = document.getElementById('effectCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let raindrops = [];
        const dropCount = 60; 

        class Raindrop {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height; 
                this.length = Math.random() * 10 + 10; 
                this.speed = Math.random() * 8 + 4; 
                this.opacity = Math.random() * 0.2 + 0.1; 
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.width || this.y > canvas.height) {
                    this.y = -this.length;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(180, 210, 240, ${this.opacity})`; 
                ctx.lineWidth = 1; 
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + (Math.random()*1 - 0.5), this.y + this.length); 
                ctx.stroke();
            }
        }

        for (let i = 0; i < dropCount; i++) {
            raindrops.push(new Raindrop());
        }

        let particles = [];
        const mouse = { x: undefined, y: undefined };

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
            for (let i = 0; i < 3; i++) {
                particles.push(new Particle());
            }
        });

        class Particle {
            constructor() {
                this.x = mouse.x;
                this.y = mouse.y;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.life = 1; 
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.1) this.size -= 0.05;
                this.life -= 0.03;
            }
            draw() {
                ctx.fillStyle = `rgba(0, 243, 255, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            for (let i = 0; i < raindrops.length; i++) {
                raindrops[i].update();
                raindrops[i].draw();
            }
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--; 
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
