<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安安百货 - 官方专属直达通道</title>
    <link rel="icon" type="image/jpeg" href="images/avatar.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; 
            position: relative;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.7);
            z-index: 1;
        }

        #effectCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; 
            pointer-events: none;
        }

        /* ====== 新的：赛博小人容器区域 ====== */
        .characters-wrapper {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* 以后放多个小人时的间距 */
            flex-wrap: wrap;
            width: 100%;
            max-width: 1200px;
        }

        /* 单个人物的卡片样式 (无白底) */
        .cyber-char-card {
            position: relative;
            width: 220px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s ease, filter 0.4s ease;
            cursor: pointer;
            animation: floating 3s ease-in-out infinite; /* 添加浮动动画 */
        }

        .cyber-char-card:hover {
            transform: translateY(-15px) scale(1.05);
            filter: drop-shadow(0 0 30px rgba(0, 243, 255, 0.8));
        }

        /* ====== CSS 生成的赛博人物剪影 ====== */
        .char-silhouette {
            width: 100px;
            height: 140px;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid rgba(0, 243, 255, 0.5);
            border-radius: 50% 50% 20% 20% / 40% 40% 60% 60%; /* 宇航员头盔/身体形状 */
            position: relative;
            margin-bottom: 10px;
        }
        .char-silhouette::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 40%;
            background: rgba(10, 10, 25, 0.9);
            border-radius: 50% / 30%;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        /* ====== 发光的赛博礼盒 ====== */
        .cyber-box {
            width: 100%;
            background: rgba(10, 10, 25, 0.9);
            border: 1px solid rgba(255, 0, 255, 0.5); /* 紫色赛博边框 */
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
            transition: border-color 0.3s;
        }
        .cyber-box::before { /* 礼盒内部流光特效 */
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 0, 255, 0.1),
                transparent
            );
            transform: rotate(45deg);
            animation: flow 4s linear infinite;
        }

        .cyber-char-card:hover .cyber-box {
            border-color: rgba(255, 0, 255, 1);
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.6);
        }

        /* 放在礼盒上的链接按钮文字 */
        .box-link-text {
            color: #ff00ff; /* 霓虹紫 */
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
            position: relative;
            z-index: 4;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .cyber-char-card:hover .box-link-text {
            color: #fff;
            text-shadow: 0 0 15px #ff00ff, 0 0 30px #ff00ff;
        }

        /* ====== 定义动画 ====== */
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        @keyframes flow {
            0% { left: -50%; }
            100% { left: 150%; }
        }

    </style>
</head>
<body>
    <div class="overlay"></div>
    <canvas id="effectCanvas"></canvas>

    <div class="characters-wrapper">
        
        <a href="https://t.me/BF88878" target="_blank" class="cyber-char-card">
            <div class="char-silhouette"></div>
            <div class="cyber-box">
                <span class="box-link-text">TG客服</span>
            </div>
        </a>

    </div>

    <script>
        // 保持不变的雨滴和鼠标特效
        const canvas = document.getElementById('effectCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let raindrops = [];
        const dropCount = 60; 

        class Raindrop {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height; 
                this.length = Math.random() * 10 + 10; 
                this.speed = Math.random() * 8 + 4; 
                this.opacity = Math.random() * 0.2 + 0.1; 
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.width || this.y > canvas.height) {
                    this.y = -this.length;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(180, 210, 240, ${this.opacity})`; 
                ctx.lineWidth = 1; 
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + (Math.random()*1 - 0.5), this.y + this.length); 
                ctx.stroke();
            }
        }

        for (let i = 0; i < dropCount; i++) {
            raindrops.push(new Raindrop());
        }

        let particles = [];
        const mouse = { x: undefined, y: undefined };

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
            for (let i = 0; i < 3; i++) {
                particles.push(new Particle());
            }
        });

        class Particle {
            constructor() {
                this.x = mouse.x;
                this.y = mouse.y;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.life = 1; 
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.1) this.size -= 0.05;
                this.life -= 0.03;
            }
            draw() {
                ctx.fillStyle = `rgba(0, 243, 255, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            for (let i = 0; i < raindrops.length; i++) {
                raindrops[i].update();
                raindrops[i].draw();
            }
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--; 
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
