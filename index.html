<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安安百货 - 官方专属直达通道</title>
    <link rel="icon" type="image/jpeg" href="images/avatar.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; 
            position: relative;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.7);
            z-index: 1;
        }

        #effectCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; 
            pointer-events: none;
        }

        /* ====== 人物容器区域 ====== */
        .characters-wrapper {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; 
            flex-wrap: wrap;
            width: 100%;
            max-width: 1200px;
        }

        /* 超大号震撼卡片区域 */
        .gift-box-character {
            position: relative;
            width: 460px; /* 👈 巨幅放大：人物宽度达到了460px，充满视觉张力 */
            display: block;
            text-decoration: none;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        /* 鼠标悬停时上浮并发出强烈赛博蓝光 */
        .gift-box-character:hover {
            transform: translateY(-18px);
            filter: drop-shadow(0 0 35px rgba(0, 243, 255, 0.9));
        }

        /* 人物图片本体 */
        .char-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ====== 被人物“抱在怀里”的文字标签（精致小巧，完美嵌在胸前/礼盒上） ====== */
        .box-button-label {
            position: absolute;
            /* 调整位置，让字刚好落在人物怀抱的正中央 */
            bottom: 27%; 
            left: 50%;
            transform: translateX(-50%);
            
            background: rgba(10, 10, 25, 0.85);
            color: #00f3ff;
            padding: 6px 16px; /* 适当减小内边距，让文字显得精致聚焦 */
            border-radius: 10px;
            font-size: 15px; /* 字体比人物小很多，形成强烈的主次对比，像被“抱”着一样 */
            font-weight: bold;
            letter-spacing: 1px;
            white-space: nowrap;
            border: 1px solid rgba(0, 243, 255, 0.6);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            z-index: 4;
        }

        /* 鼠标悬停时，怀里的字变成亮蓝色发光体 */
        .gift-box-character:hover .box-button-label {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 25px rgba(0, 243, 255, 1);
        }

    </style>
</head>
<body>
    <div class="overlay"></div>
    <canvas id="effectCanvas"></canvas>

    <div class="characters-wrapper">
        
        <a href="https://t.me/BF88878" target="_blank" class="gift-box-character">
            <img src="images/box-character.png" alt="TG客服" class="char-img">
            <div class="box-button-label">TG客服</div>
        </a>

    </div>

    <script>
        // 背景雨滴和鼠标特效
        const canvas = document.getElementById('effectCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let raindrops = [];
        const dropCount = 60; 

        class Raindrop {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height; 
                this.length = Math.random() * 10 + 10; 
                this.speed = Math.random() * 8 + 4; 
                this.opacity = Math.random() * 0.2 + 0.1; 
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.width || this.y > canvas.height) {
                    this.y = -this.length;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(180, 210, 240, ${this.opacity})`; 
                ctx.lineWidth = 1; 
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + (Math.random()*1 - 0.5), this.y + this.length); 
                ctx.stroke();
            }
        }

        for (let i = 0; i < dropCount; i++) {
            raindrops.push(new Raindrop());
        }

        let particles = [];
        const mouse = { x: undefined, y: undefined };

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
            for (let i = 0; i < 3; i++) {
                particles.push(new Particle());
            }
        });

        class Particle {
            constructor() {
                this.x = mouse.x;
                this.y = mouse.y;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.life = 1; 
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.1) this.size -= 0.05;
                this.life -= 0.03;
            }
            draw() {
                ctx.fillStyle = `rgba(0, 243, 255, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            for (let i = 0; i < raindrops.length; i++) {
                raindrops[i].update();
                raindrops[i].draw();
            }
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--; 
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
