<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安安百货 - 官方专属直达通道</title>
    <link rel="icon" type="image/jpeg" href="images/avatar.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            /* 你的背景图在最外面 */
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; 
            position: relative;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.7);
            z-index: 1;
        }

        #effectCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; 
            pointer-events: none;
        }

        /* ====== 新的：人物容器区域 ====== */
        .characters-wrapper {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px; /* 以后放多个小人时的间距 */
            flex-wrap: wrap;
            width: 100%;
            max-width: 1200px;
        }

        /* 单个人物的卡片（透明背景） */
        .character-card {
            position: relative;
            width: 240px; /* 小人的宽度，可以根据需要改大小 */
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        /* 鼠标移到小人身上时的浮动发光特效 */
        .character-card:hover {
            transform: translateY(-15px);
            filter: drop-shadow(0 0 25px rgba(0, 243, 255, 0.6));
        }

        /* 抠好的小人图片 */
        .char-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 放在礼盒上的文字按钮 */
        .box-btn {
            position: absolute;
            /* 👇 【关键位置】如果按钮偏上或偏下，请修改这个 bottom 的百分比（比如改成 20% 或 30%） */
            bottom: 22%; 
            left: 50%;
            transform: translateX(-50%);
            
            /* 按钮外观设计 */
            background: rgba(10, 10, 25, 0.85);
            color: #00f3ff;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
            border: 1px solid rgba(0, 243, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }

        /* 鼠标移到按钮上时更亮 */
        .character-card:hover .box-btn {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
        }

    </style>
</head>
<body>
    <div class="overlay"></div>
    <canvas id="effectCanvas"></canvas>

    <div class="characters-wrapper">
        
        <div class="character-card">
            <img src="images/box-character.png" alt="TG客服" class="char-img">
            <a href="https://t.me/BF88878" target="_blank" class="box-btn">TG客服</a>
        </div>

    </div>

    <script>
        // ====== 保持不变的雨滴和鼠标特效 ======
        const canvas = document.getElementById('effectCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let raindrops = [];
        const dropCount = 60; 

        class Raindrop {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height; 
                this.length = Math.random() * 10 + 10; 
                this.speed = Math.random() * 8 + 4; 
                this.opacity = Math.random() * 0.2 + 0.1; 
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.width || this.y > canvas.height) {
                    this.y = -this.length;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(180, 210, 240, ${this.opacity})`; 
                ctx.lineWidth = 1; 
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + (Math.random()*1 - 0.5), this.y + this.length); 
                ctx.stroke();
            }
        }

        for (let i = 0; i < dropCount; i++) {
            raindrops.push(new Raindrop());
        }

        let particles = [];
        const mouse = { x: undefined, y: undefined };

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
            for (let i = 0; i < 3; i++) {
                particles.push(new Particle());
            }
        });

        class Particle {
            constructor() {
                this.x = mouse.x;
                this.y = mouse.y;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.life = 1; 
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.1) this.size -= 0.05;
                this.life -= 0.03;
            }
            draw() {
                ctx.fillStyle = `rgba(0, 243, 255, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            for (let i = 0; i < raindrops.length; i++) {
                raindrops[i].update();
                raindrops[i].draw();
            }
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--; 
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
